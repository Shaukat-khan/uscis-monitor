name: US Citizenship Ready data monitor

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      simulate_change:
        description: "Mutate Ohio governor after fetch to test email/diff (does not commit fake data)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  update-civics-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pypdf
      - name: Build civics_data.json and notify on changes
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SIMULATE_CHANGE: ${{ github.event.inputs.simulate_change == 'true' && '1' || '' }}
        run: python monitor.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update civics_data.json snapshot"
          file_pattern: civics_data.json
          commit_user_name: uscis-monitor-bot
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
